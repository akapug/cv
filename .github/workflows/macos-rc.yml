name: macOS rc artifact smoke

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Release run ID
        required: true
        type: string
      tag:
        description: Exact rc tag (v0.18.0-rc.1)
        required: true
        type: string
      sha:
        description: Full source commit SHA from that run
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(github.event.workflow_run.head_branch, '-rc'))
    # Native architectures, checked by the helper before downloading/executing.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      # Trusted helper/fixtures come from the default branch, never from a run artifact.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify release identity, archive digest and native binary
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_REPO: ${{ github.repository }}
          SMOKE_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
          SMOKE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          SMOKE_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
          SMOKE_TARGET: ${{ matrix.target }}
        run: >-
          python3 -I tools/smoke-rc.py --repo "$SMOKE_REPO" --run-id "$SMOKE_RUN"
          --tag "$SMOKE_TAG" --sha "$SMOKE_SHA" --target "$SMOKE_TARGET"
