# formats/chatgpt-export.toml — the vocabulary cv's `chatgpt-export` adapter is checked against (docs/INTERFACE-V2.md §7).
# Lists only what the source cannot say: an item the adapter has a match arm for is `handled` by inference and is
# not listed. generic = interpreted by a blanket rule; carried = verbatim under ParseOptions::complete only;
# ignored = known and deliberately skipped; handled = interpreted, but not by a match arm (a SQL identifier, a path).
# tests/formats_manifest.rs holds it to the adapter source.

harness = "chatgpt-export"
source_files = ["harness/export.rs", "harness/export/native.rs", "harness/wire/anthropic.rs", "harness/wire/mod.rs"]
# `human` is claude-export vocabulary; harness/export.rs and export/native.rs serve both export harnesses.
ignore_literals = ["conversations.json", "human"]
store = [
  "registered conversations.json (cv config --add-export)",
]

[upstream]
repo = "ChatGPT data export"
commit = "unknown"
date = "2026-05-29"

[types]
"author.system" = { status = "generic", note = "" }
"content.text" = { status = "handled", note = "" }
"content.thinking" = { status = "handled", note = "" }
"content.tool_use" = { status = "handled", note = "" }
"content.tool_result" = { status = "handled", note = "" }
"content.multimodal_text" = { status = "generic", note = "image_asset_pointer → Image" }
"content.code" = { status = "generic", note = "" }
"content.execution_output" = { status = "generic", note = "" }
"content.tether_browsing_display" = { status = "ignored", note = "" }
"content.user_editable_context" = { status = "ignored", note = "custom instructions" }
"recipient.tool" = { status = "generic", note = "recipient ≠ all ⇒ tool call" }
