# formats/zed.toml — the vocabulary cv's `zed` adapter is checked against (docs/INTERFACE-V2.md §7).
# Lists only what the source cannot say: an item the adapter has a match arm for is `handled` by inference and is
# not listed. generic = interpreted by a blanket rule; carried = verbatim under ParseOptions::complete only;
# ignored = known and deliberately skipped; handled = interpreted, but not by a match arm (a SQL identifier, a path).
# tests/formats_manifest.rs holds it to the adapter source.

harness = "zed"
source_files = ["harness/zed.rs", "harness/zed/record.rs", "harness/wire/anthropic.rs", "harness/wire/mod.rs"]
ignore_literals = []
store = [
  "<data_dir>/threads/threads.db (zstd blobs)",
]

[upstream]
repo = "https://github.com/zed-industries/zed (not checked out)"
commit = "unknown"
date = "2026-05-29"

[types]
"v3.User" = { status = "handled", note = "" }
"v3.Agent" = { status = "handled", note = "" }
"v3.Text" = { status = "handled", note = "" }
"v3.Thinking" = { status = "handled", note = "" }
"v3.ToolUse" = { status = "handled", note = "" }
"v3.Image" = { status = "handled", note = "" }
"v3.Mention" = { status = "handled", note = "→ File (uri)" }
"v3.Compaction" = { status = "handled", note = "Summary" }
"v3.Summary" = { status = "handled", note = "" }
"v3.Resume" = { status = "generic", note = "bare marker" }
