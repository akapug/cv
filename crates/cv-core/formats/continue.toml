# formats/continue.toml — the vocabulary cv's `continue` adapter is checked against (docs/INTERFACE-V2.md §7).
# Lists only what the source cannot say: an item the adapter has a match arm for is `handled` by inference and is
# not listed. generic = interpreted by a blanket rule; carried = verbatim under ParseOptions::complete only;
# ignored = known and deliberately skipped; handled = interpreted, but not by a match arm (a SQL identifier, a path).
# tests/formats_manifest.rs holds it to the adapter source.

harness = "continue"
source_files = ["harness/continuedev.rs", "harness/continuedev/record.rs", "harness/wire/openai.rs", "harness/wire/mod.rs"]
ignore_literals = ["sessions.json"]
store = [
  "$CONTINUE_GLOBAL_DIR or ~/.continue/sessions/{sessions.json,<id>.json}",
]

[upstream]
repo = "https://github.com/continuedev/continue (not checked out)"
commit = "cn 1.5.47 (npm @continuedev/cli, tests/corpus/continue/1.5.47)"
date = "2026-10-11"

[types]
"part.text" = { status = "handled", note = "" }
"part.imageUrl" = { status = "handled", note = "" }
"field.toolCalls" = { status = "generic", note = "" }
"field.contextItems" = { status = "generic", note = "→ File" }
"field.toolCallStates" = { status = "handled", note = "cn CLI: per-call status + output on the assistant item -> a Tool message" }
"field.usage" = { status = "handled", note = "cn CLI: OpenAI usage names + model + cost_cents -> Usage" }
