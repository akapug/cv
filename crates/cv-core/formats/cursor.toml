# formats/cursor.toml — the vocabulary cv's `cursor` adapter is checked against (docs/INTERFACE-V2.md §7).
# Lists only what the source cannot say: an item the adapter has a match arm for is `handled` by inference and is
# not listed. generic = interpreted by a blanket rule; carried = verbatim under ParseOptions::complete only;
# ignored = known and deliberately skipped; handled = interpreted, but not by a match arm (a SQL identifier, a path).
# tests/formats_manifest.rs holds it to the adapter source.

harness = "cursor"
source_files = ["harness/cursor.rs", "harness/cursor/record.rs", "harness/cursor/legacy.rs", "harness/cursor/cli.rs"]
ignore_literals = []
store = [
  "~/Library/Application Support/Cursor/User/globalStorage/state.vscdb",
  "…/workspaceStorage/<hash>/state.vscdb",
  "~/.cursor/chats/<md5(cwd)>/<agentId>/store.db",
  "~/.cursor/acp-sessions/<agentId>/store.db",
]

[upstream]
repo = "closed source"
commit = "unknown"
date = "2026-05-29"

[types]
"kv.composerData" = { status = "generic", note = "one thread" }
"kv.bubbleId" = { status = "generic", note = "one message" }
"field.thinking" = { status = "generic", note = "" }
"field.toolFormerData" = { status = "generic", note = "tool call + result" }
"field.richText" = { status = "generic", note = "Lexical" }
"field.tokenCount" = { status = "generic", note = "" }

"field.providerOptions" = { status = "generic", note = "CLI injected context, summaries, model and error metadata" }
